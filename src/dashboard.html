<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>徐胖虎资源社｜广播控制台 V2.8</title>
<style>
*{box-sizing:border-box}
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{margin:0;background:#f5f7fb;color:#111827}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff}
button.secondary{background:#eef2f7;color:#111827}
button.danger{background:#fee2e2;color:#991b1b}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#111827;color:#fff;padding:22px 14px}
.brand{font-size:18px;font-weight:800;padding:8px 10px 22px}
nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;margin:4px 0}
nav button.active,nav button:hover{background:#1f2937;color:#fff}
main{padding:28px;max-width:1500px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 24px #0000000a}
.stat b{font-size:28px;display:block;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.stats>div{background:#f8fafc;border:1px solid #edf0f3;border-radius:12px;padding:14px}.stats b{font-size:24px;display:block;margin-bottom:5px}
.muted{color:#6b7280}
.panel{margin-top:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}
textarea{width:100%;min-height:280px;border:1px solid #dbe2ea;border-radius:12px;padding:15px;resize:vertical}
input,select{width:100%;padding:11px;border:1px solid #dbe2ea;border-radius:10px;background:#fff}
label{font-size:13px;font-weight:700;display:block;margin:14px 0 6px}
.check{display:flex;align-items:center;gap:8px;margin:10px 0}
.check input{width:auto}
.table{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px;border-bottom:1px solid #edf0f3;white-space:nowrap}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}
.channel{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.button-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}
.preview{border:1px dashed #cbd5e1;border-radius:14px;padding:18px;background:#f8fafc;min-height:180px}
.hidden{display:none}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px}
@media(max-width:900px){
  body{background:#f5f7fb;padding-bottom:74px}
  .app{display:block;min-height:100vh}
  aside{position:fixed;z-index:50;left:0;right:0;bottom:0;height:66px;padding:6px 8px;background:#111827;border-top:1px solid #273244;box-shadow:0 -6px 24px #00000018}
  .brand{display:none}
  nav{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;height:100%}
  nav button{margin:0;padding:7px 3px;border-radius:9px;text-align:center;font-size:11px;line-height:1.15;min-width:0;color:#cbd5e1;overflow:hidden}
  nav button:nth-child(n+6){display:none}
  nav button.active{background:#374151;color:#fff}
  main{padding:14px 12px 20px;max-width:none}
  .top{position:sticky;top:0;z-index:20;background:#f5f7fb;margin:-14px -12px 14px;padding:12px;gap:10px;border-bottom:1px solid #e9edf2}
  .top h1{font-size:20px;margin:0 0 2px}.top .muted{font-size:12px}
  .top .row{gap:6px}.top button{padding:8px 10px;font-size:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{border-radius:14px;padding:14px;box-shadow:0 3px 16px #0000000a}
  .stat b{font-size:23px}
  h2{font-size:18px;margin:2px 0 12px}h3{font-size:15px}
  .editor{grid-template-columns:1fr;gap:12px}
  textarea{min-height:190px;font-size:16px}
  input,select{font-size:16px;min-height:44px}
  button{min-height:44px;padding:10px 13px}
  .row{align-items:stretch}
  .row>input,.row>select,.row>button{flex:1 1 100%;min-width:0}
  .button-row{grid-template-columns:1fr;gap:8px}
  .table{margin:0 -14px;padding:0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  th,td{padding:10px 9px;font-size:13px}
  .preview{min-height:130px}
  .channel{gap:10px}
  .toast{left:12px;right:12px;bottom:78px;text-align:center}
}
@media(max-width:430px){
  nav button{font-size:10px}
  .grid{gap:8px}.card{padding:12px}.stat b{font-size:21px}
  .top .danger{display:none}
}
</style>
</head>
<body>
<div id="app" class="app">
<aside>
  <div class="brand">📢 徐胖虎资源社</div>
  <nav>
    <button class="active" data-page="dashboard">📊 仪表盘</button>
    <button data-page="broadcast">📣 新建广播</button>
    <button data-page="drafts">📝 草稿箱</button>
    <button data-page="schedule">⏰ 排期</button>
    <button data-page="channels">📺 频道</button>
    <button data-page="history">📚 历史</button>
    <button data-page="media">🖼️ 媒体库</button>
    <button data-page="builder">🧩 广播编排</button>
    <button data-page="metrics">📊 发送统计</button><button data-page="commercial">💰 商业中心</button>
    <button data-page="audit">🔐 操作审计</button>
    <button data-page="admins">👥 管理员</button>
  </nav>
</aside>
<main>
  <div class="top"><div><h1 id="title">仪表盘</h1><div class="muted">V2.8 · 运营控制台</div></div>
  <div class="row"><button class="secondary" id="refresh">刷新</button><button class="danger" onclick="location.href='/admin/logout'">退出登录</button></div></div>

  <section id="dashboard" class="page">
    <div class="grid">
      <div class="card stat">📣 <b id="sTotal">0</b><span class="muted">广播记录</span></div>
      <div class="card stat">📝 <b id="sDraft">0</b><span class="muted">草稿</span></div>
      <div class="card stat">⏰ <b id="sScheduled">0</b><span class="muted">待排期</span></div>
      <div class="card stat">✅ <b id="sPublished">0</b><span class="muted">已发布</span></div>
    </div>
    <div class="card panel"><h2>最近广播</h2><div id="recent"></div></div>
  </section>

  <section id="broadcast" class="page hidden">
    <div class="editor">
      <div class="card">
        <h2>新建广播</h2>
        <label>广播内容</label>
        <textarea id="content" placeholder="输入文字内容……"></textarea>
        <label>媒体 file_id / R2 URL（可选）</label>
        <input id="mediaUrl" type="text" placeholder="预留媒体发布接口">
        <label>按钮</label>
        <div id="buttons"></div>
        <button class="secondary" id="addButton">＋ 添加按钮</button>
        <div class="row" style="margin-top:20px">
          <button id="saveDraft">保存草稿</button>
          <button id="publishNow">立即发布</button>
        </div>
      </div>
      <div class="card">
        <h2>发布设置</h2>
        <label>频道</label>
        <div id="targetChannels"></div>
        <label>发布时间</label>
        <input id="scheduledAt" type="datetime-local">
        <label class="check"><input id="pin" type="checkbox"> 发布后自动置顶</label>
        <label class="check"><input id="silent" type="checkbox"> 静默发布</label>
        <h3>实时预览</h3>
        <div class="preview" id="preview">等待输入内容……</div>
        <button class="secondary" id="scheduleBtn" style="margin-top:12px;width:100%">创建定时广播</button>
      </div>
    </div>
  </section>

  <section id="drafts" class="page hidden"><div class="card"><h2>草稿箱</h2><div id="draftList"></div></div></section>
  <section id="schedule" class="page hidden"><div class="card"><h2>排期中心</h2><div id="scheduleList"></div></div></section>
  <section id="channels" class="page hidden"><div class="card"><h2>频道管理</h2><p class="muted">先把机器人添加为频道管理员，再填写频道用户名或 Chat ID。</p><div class="row"><input id="channelChatId" placeholder="@频道用户名 或数字 Chat ID"><input id="channelTitle" placeholder="频道名称（可选）"><button id="addChannel">新增频道</button></div><div id="channelList"></div></div></section>
  <section id="history" class="page hidden"><div class="card"><h2>广播历史</h2><div id="historyList"></div></div></section>
  <section id="media" class="page hidden"><div class="card"><h2>媒体库</h2>
<p class="muted" id="mediaStatus">R2 状态：由 Worker 自动检测。</p>
<div class="row"><input id="mediaFile" type="file"><button id="uploadMedia">上传到 R2</button></div>
<div id="mediaList"></div></div></section>
<section id="builder" class="page hidden"><div class="card"><h2>🧩 广播编排</h2>
<p class="muted">拖拽媒体和按钮调整顺序；发布前可直接检查内容。</p>
<textarea id="builderContent" placeholder="广播正文"></textarea>
<h3>按钮</h3><div id="builderButtons"></div>
<div class="row"><input id="btnLabel" placeholder="按钮文字"><input id="btnUrl" placeholder="https://example.com"><button id="addBtn">添加按钮</button></div>
<h3>媒体 ID</h3><div id="builderMedia" class="dropzone"></div>
<div class="row"><input id="builderMediaId" placeholder="媒体库 ID"><button id="addMedia">添加媒体</button><button id="saveBuilder">保存草稿</button></div></div></section>
<section id="metrics" class="page hidden"><div class="card"><h2>📊 发送统计</h2><div id="metricsList"></div></div></section>
<section id="commercial" class="page hidden"><div class="card"><h2>💰 商业中心</h2>
<div class="stats"><div><b id="finReceived">0</b><span>已收款 USDT</span></div><div><b id="finPending">0</b><span>待收款 USDT</span></div><div><b id="finOrders">0</b><span>订单数</span></div></div>
<h3>广告客户</h3><div id="customers"></div><div class="row"><input id="custName" placeholder="客户名称"><input id="custTg" placeholder="Telegram"><input id="custContact" placeholder="联系方式"><button id="addCustomer">新增客户</button></div>
<h3>广告订单</h3><div id="orders"></div><div class="row"><input id="orderCustomer" placeholder="客户 ID"><input id="orderAmount" type="number" step="0.01" placeholder="金额 USDT"><input id="orderStart" type="datetime-local"><input id="orderEnd" type="datetime-local"><button id="addOrder">创建订单</button></div>
<h3>广告排期</h3><div id="adCalendar"></div></div></section><section id="audit" class="page hidden"><div class="card"><h2>操作审计</h2><div id="auditList"></div></div></section>
<section id="admins" class="page hidden"><div class="card"><h2>管理员</h2><div id="adminList"></div>
<div class="row" style="margin-top:15px"><input id="adminId" placeholder="Telegram numeric user ID"><select id="adminRole"><option value="viewer">viewer</option><option value="editor">editor</option><option value="owner">owner</option></select><button id="addAdmin">添加/更新</button></div></div></section>
</main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let channels=[];
function toast(t){$("#toast").textContent=t;$("#toast").classList.remove("hidden");setTimeout(()=>$("#toast").classList.add("hidden"),2200)}
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function api(path,opt={}){const r=await fetch("/api"+path,{credentials:"include",...opt,headers:{"content-type":"application/json",...(opt.headers||{})}});if(r.status===401){location.href="/admin/login";throw Error("未登录")}const d=await r.json();if(!r.ok)throw Error(d.error||"请求失败");return d}
function page(name){$$(".page").forEach(x=>x.classList.add("hidden"));$("#"+name).classList.remove("hidden");$$("nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===name));$("#title").textContent={dashboard:"仪表盘",broadcast:"新建广播",drafts:"草稿箱",schedule:"排期中心",channels:"频道管理",history:"广播历史",audit:"操作审计",media:"媒体库",builder:"广播编排",metrics:"发送统计",commercial:"商业中心",admins:"管理员"}[name]||name;load(name)}
$$("nav button").forEach(b=>b.onclick=()=>page(b.dataset.page));$("#refresh").onclick=()=>load(document.querySelector("nav button.active").dataset.page);
function table(rows,heads,render){if(!rows.length)return '<div class="muted">暂无数据</div>';return `<div class="table"><table><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.map(render).join("")}</table></div>`}
$("#addChannel").onclick=async()=>{const chat_id=$("#channelChatId").value.trim(),title=$("#channelTitle").value.trim();if(!chat_id){toast("请填写频道用户名或 Chat ID");return}try{await api("/channels",{method:"POST",body:JSON.stringify({chat_id,title,enabled:true})});$("#channelChatId").value="";$("#channelTitle").value="";toast("频道已添加");load("channels")}catch(e){toast(e.message)}};
async function load(p){
  try{
    if(p==="dashboard"){let d=await api("/dashboard");$("#sTotal").textContent=d.stats.total;$("#sDraft").textContent=d.stats.drafts;$("#sScheduled").textContent=d.stats.scheduled;$("#sPublished").textContent=d.stats.published;$("#recent").innerHTML=table(d.recent,["ID","状态","类型","频道","时间"],x=>`<tr><td>#${x.id}</td><td><span class=badge>${esc(x.status)}</span></td><td>${esc(x.content_type)}</td><td>${esc(x.channel_id)}</td><td>${esc(x.published_at||x.scheduled_at||x.created_at)}</td></tr>`)}
    if(p==="channels"){let d=await api("/channels");channels=d.channels;$("#channelList").innerHTML=channels.map(x=>`<div class=channel><span>📺 ${esc(x.title||x.chat_id)}<br><small class=muted>${esc(x.chat_id)}</small></span><span class=badge>${x.enabled?"启用":"停用"}</span></div>`).join("")||"暂无频道";renderTargets()}
    if(p==="drafts"){let d=await api("/drafts");$("#draftList").innerHTML=table(d.rows,["ID","类型","状态","创建时间","操作"],x=>`<tr><td>#${x.id}</td><td>${esc(x.content_type)}</td><td>${esc(x.status)}</td><td>${esc(x.created_at)}</td><td><button onclick="publish(${x.id})">发布</button> <button class=secondary onclick="delDraft(${x.id})">删除</button></td></tr>`)}
    if(p==="schedule"){let d=await api("/scheduled");$("#scheduleList").innerHTML=table(d.rows,["ID","状态","频道","排期","操作"],x=>`<tr><td>#${x.id}</td><td>${esc(x.status)}</td><td>${esc(x.channel_id)}</td><td>${esc(x.scheduled_at)}</td><td><button class=danger onclick="cancelSchedule(${x.id})">取消</button></td></tr>`)}
    if(p==="history"){let d=await api("/history");$("#historyList").innerHTML=table(d.rows,["ID","状态","类型","频道","消息ID","发布时间"],x=>`<tr><td>#${x.id}</td><td>${esc(x.status)}</td><td>${esc(x.content_type)}</td><td>${esc(x.channel_id)}</td><td>${x.channel_message_id||"-"}</td><td>${esc(x.published_at||"-")}</td></tr>`)}
    if(p==="commercial"){loadCommercial()} if(p==="commercial"){loadCommercial()}
    if(p==="audit"){let d=await api("/audit");$("#auditList").innerHTML=table(d.rows,["管理员","操作","目标","详情","时间"],x=>`<tr><td>${x.admin_id}</td><td>${esc(x.action)}</td><td>${esc((x.target_type||"")+" "+(x.target_id||""))}</td><td>${esc(x.detail||"")}</td><td>${esc(x.created_at)}</td></tr>`)}
    if(p==="media"){let d=await api("/media");$("#mediaList").innerHTML=table(d.rows,["ID","类型","文件名","MIME","大小","创建时间"],x=>`<tr><td>#${x.id}</td><td>${esc(x.kind)}</td><td>${esc(x.file_name||"-")}</td><td>${esc(x.mime_type||"-")}</td><td>${x.size_bytes||"-"}</td><td>${esc(x.created_at)}</td></tr>`)}
    if(p==="admins"){let d=await api("/roles");$("#adminList").innerHTML=table(d.rows,["User ID","角色","状态"],x=>`<tr><td>${x.user_id}</td><td>${esc(x.role)}</td><td>${x.enabled?"启用":"停用"}</td></tr>`)}
  }catch(e){toast(e.message)}
}
function renderTargets(){if(!channels.length){$("#targetChannels").innerHTML='<span class=muted>暂无频道，请先添加频道</span>';return}$("#targetChannels").innerHTML=channels.map(x=>`<label class=check><input type=checkbox value="${esc(x.chat_id)}" checked> ${esc(x.title||x.chat_id)}</label>`).join("")}
$("#content").oninput=()=>{$("#preview").innerHTML=esc($("#content").value).replace(/\n/g,"<br>")||"等待输入内容……"}
$("#addButton").onclick=()=>{let d=document.createElement("div");d.className="button-row";d.innerHTML='<input class="bl" placeholder="按钮文字"><input class="bu" placeholder="https://example.com"><button class="danger" onclick="this.parentElement.remove()">×</button>';$("#buttons").appendChild(d)}
async function create(status){const targets=$$("#targetChannels input:checked").map(x=>x.value);if(!targets.length)throw Error("请选择频道");const body={content:$("#content").value,media_url:$("#mediaUrl")?.value||null,targets,scheduled_at:$("#scheduledAt").value||null,pin:$("#pin").checked,silent:$("#silent").checked,buttons:$$(".button-row").map(r=>({label:$(".bl",r).value,url:$(".bu",r).value})).filter(x=>x.label&&x.url),status};return api("/broadcasts",{method:"POST",body:JSON.stringify(body)})}
$("#saveDraft").onclick=async()=>{try{await create("draft");toast("已保存草稿");page("drafts")}catch(e){toast(e.message)}}
$("#publishNow").onclick=async()=>{try{await create("publish");toast("已发布");page("history")}catch(e){toast(e.message)}}
$("#scheduleBtn").onclick=async()=>{if(!$("#scheduledAt").value){toast("请选择时间");return}try{await create("scheduled");toast("排期创建成功");page("schedule")}catch(e){toast(e.message)}}
$("#addAdmin").onclick=async()=>{try{await api("/roles",{method:"POST",body:JSON.stringify({user_id:Number($("#adminId").value),role:$("#adminRole").value})});toast("管理员已更新");load("admins")}catch(e){toast(e.message)}}
async function publish(id){try{await api("/drafts/"+id+"/publish",{method:"POST"});toast("发布成功");load("drafts")}catch(e){toast(e.message)}}
async function delDraft(id){if(!confirm("删除草稿？"))return;try{await api("/drafts/"+id,{method:"DELETE"});toast("已删除");load("drafts")}catch(e){toast(e.message)}}
async function cancelSchedule(id){if(!confirm("取消排期？"))return;try{await api("/scheduled/"+id,{method:"DELETE"});toast("已取消");load("schedule")}catch(e){toast(e.message)}}
page("dashboard"); load("channels");

let builderButtons=[],builderMedia=[];
function renderBuilder(){
  $("#builderButtons").innerHTML=builderButtons.map((x,i)=>`<div class="item" draggable="true" data-i="${i}">☰ ${esc(x.label)} <button class="danger small" onclick="builderButtons.splice(${i},1);renderBuilder()">删除</button></div>`).join("");
  $("#builderMedia").innerHTML=builderMedia.map((x,i)=>`<div class="item" draggable="true" data-i="${i}">☰ 媒体 #${x} <button class="danger small" onclick="builderMedia.splice(${i},1);renderBuilder()">删除</button></div>`).join("");
  document.querySelectorAll("#builderButtons .item,#builderMedia .item").forEach(el=>el.ondragend=()=>{});
}
$("#addBtn").onclick=()=>{let l=$("#btnLabel").value,u=$("#btnUrl").value;if(l&&/^https?:\/\//.test(u)){builderButtons.push({label:l,url:u});$("#btnLabel").value="";$("#btnUrl").value="";renderBuilder()}};
$("#addMedia").onclick=()=>{let x=Number($("#builderMediaId").value);if(x){builderMedia.push(x);$("#builderMediaId").value="";renderBuilder()}};
$("#saveBuilder").onclick=async()=>{try{let r=await api("/broadcast-builder",{method:"POST",body:JSON.stringify({content:$("#builderContent").value,buttons:builderButtons,media_ids:builderMedia,status:"draft"})});toast("草稿已保存 #"+r.id)}catch(e){toast(e.message)}};
$("#uploadMedia").onclick=async()=>{let f=$("#mediaFile").files[0];if(!f){toast("请选择文件");return}try{
  let m=await api("/media/upload-url",{method:"POST",body:JSON.stringify({file_name:f.name,mime_type:f.type,size_bytes:f.size,kind:(f.type||"").startsWith("image/")?"photo":(f.type||"").startsWith("video/")?"video":"document"})});
  let r=await fetch(m.upload_url,{method:"PUT",headers:{"Content-Type":f.type||"application/octet-stream"},body:f});
  if(!r.ok)throw Error("R2 上传失败");
  toast("媒体上传成功");load("media");
}catch(e){toast(e.message)}};

async function loadCommercial(){
 try{let f=await api("/commercial/finance");$("#finReceived").textContent=Number(f.received).toFixed(2);$("#finPending").textContent=Number(f.pending).toFixed(2);$("#finOrders").textContent=f.orders}catch(e){}
 try{
  let c=await api("/commercial/customers");$("#customers").innerHTML=table(c.rows,["ID","客户","Telegram","联系方式","状态"],x=>`<tr><td>#${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.telegram||"-")}</td><td>${esc(x.contact||"-")}</td><td>${esc(x.status)}</td></tr>`);
  let o=await api("/commercial/orders");$("#orders").innerHTML=table(o.rows,["ID","客户","套餐","金额","订单","收款","开始","结束"],x=>`<tr><td>#${x.id}</td><td>${esc(x.customer_name||x.customer_id)}</td><td>${esc(x.package_name||"-")}</td><td>${Number(x.amount_usdt||0).toFixed(2)}</td><td>${esc(x.status)}</td><td>${esc(x.payment_status)}</td><td>${esc(x.start_at||"-")}</td><td>${esc(x.end_at||"-")}</td></tr>`);
  let c2=await api("/commercial/orders/calendar");$("#adCalendar").innerHTML=table(c2.rows,["订单","客户","金额","状态","开始","结束","频道"],x=>`<tr><td>#${x.id}</td><td>${esc(x.customer_name||"-")}</td><td>${Number(x.amount_usdt||0).toFixed(2)}</td><td>${esc(x.status)}</td><td>${esc(x.start_at||"-")}</td><td>${esc(x.end_at||"-")}</td><td>${esc(x.channel_id||"-")}</td></tr>`);
 }catch(e){toast(e.message)}
}
$("#addCustomer").onclick=async()=>{try{await api("/commercial/customers",{method:"POST",body:JSON.stringify({name:$("#custName").value,telegram:$("#custTg").value,contact:$("#custContact").value})});toast("客户已创建");loadCommercial()}catch(e){toast(e.message)}};
$("#addOrder").onclick=async()=>{try{await api("/commercial/orders",{method:"POST",body:JSON.stringify({customer_id:Number($("#orderCustomer").value),amount_usdt:Number($("#orderAmount").value),start_at:$("#orderStart").value,end_at:$("#orderEnd").value})});toast("订单已创建");loadCommercial()}catch(e){toast(e.message)}};
</script>
</body>
</html>
