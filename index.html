<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>徐胖虎资源社｜Telegram 广播机器人</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#151d34;--line:#2a3658;--text:#eef3ff;--muted:#aeb9d6;--accent:#62a5ff}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#172445);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    main{width:min(900px,92%);margin:0 auto;padding:11vh 0}.card{background:rgba(21,29,52,.9);border:1px solid var(--line);border-radius:24px;padding:clamp(28px,6vw,64px);box-shadow:0 24px 80px rgba(0,0,0,.28)}
    .eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em}h1{font-size:clamp(34px,7vw,64px);line-height:1.05;margin:16px 0}p{color:var(--muted);font-size:18px;line-height:1.8;max-width:700px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin:28px 0}.button{display:inline-block;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:700;background:var(--accent);color:#071225}.button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.note{border-top:1px solid var(--line);padding-top:24px;margin-top:34px;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <main><section class="card">
    <div class="eyebrow">XPH TELEGRAM BROADCAST BOT V2.8</div>
    <h1>徐胖虎资源社<br>广播控制台</h1>
    <p>用于 Telegram 频道广播、草稿管理、定时排期、频道维护、发送统计、操作审计和商业化运营。媒体库功能当前暂时关闭。</p>
    <div class="actions">
      <a class="button" href="https://xph-telegram-broadcast-bot.huaaplus.workers.dev/admin">打开管理后台</a>
      <a class="button secondary" href="https://github.com/JettKing/telegram-broadcast-bot">查看项目仓库</a>
    </div>
    <div class="note">后端运行于 Cloudflare Worker，数据库使用 Cloudflare D1；请通过后台登录或 Authorization Bearer Token 访问受保护接口。</div>
  </section></main>
</body>
</html>
